<!DOCTYPE html>
<meta charset="utf-8">
<title>Indicator Positioning</title>
<body>

<h1>Indicator Positioning</h1>

<all-around-keyboard id="kb" notes-in-octave="12"
                     raised-notes="[1,3,6,8,10]"
                     sweep="270" octaves="1" transition-time="500"
                     depth="120" width="500">
  <!-- Zodiac animals - one per key (auto-positioned at key's radial center) -->
  <span data-key="36" class="zodiac">🐀</span>
  <span data-key="37" class="zodiac">🐂</span>
  <span data-key="38" class="zodiac">🐅</span>
  <span data-key="39" class="zodiac">🐇</span>
  <span data-key="40" class="zodiac">🐉</span>
  <span data-key="41" class="zodiac">🐍</span>
  <span data-key="42" class="zodiac">🐴</span>
  <span data-key="43" class="zodiac">🐐</span>
  <span data-key="44" class="zodiac">🐒</span>
  <span data-key="45" class="zodiac">🐓</span>
  <span data-key="46" class="zodiac">🐕</span>
  <span data-key="47" class="zodiac">🐖</span>

  <!-- Wave emoji - uses standing wave with harmonic wave number -->
  <span id="wave" data-pitch="0" data-radius="0.5" data-wave-number="3" data-wave-amplitude="0.35" class="wave">🌊</span>

  <!-- Footstep - steps through integer pitches to verify alignment -->
  <span id="footstep" data-pitch="0" data-radius="0" class="footstep">🐾</span>
</all-around-keyboard>

<div class="controls">
  <label class="toggle">
    <input type="checkbox" id="circular">
    <span>Circular</span>
  </label>
  <label>
    Speed: <input type="range" id="speed" min="0.5" max="5" step="0.1" value="1">
    <span id="speed-value">1x</span>
  </label>
  <label>
    Wave #: <input type="range" id="waveNum" min="1" max="6" step="1" value="3">
    <span id="waveNum-value">3</span>
  </label>
  <label>
    Amplitude: <input type="range" id="amplitude" min="0" max="0.4" step="0.05" value="0.35">
    <span id="amplitude-value">0.35</span>
  </label>
</div>

<script src="../lib/all-around-keyboard.js"></script>
<script>
  const kb = document.getElementById('kb');
  const wave = document.getElementById('wave');
  const footstep = document.getElementById('footstep');
  const circularInput = document.getElementById('circular');
  const speedInput = document.getElementById('speed');
  const waveNumInput = document.getElementById('waveNum');
  const amplitudeInput = document.getElementById('amplitude');
  const speedValue = document.getElementById('speed-value');
  const waveNumValue = document.getElementById('waveNum-value');
  const amplitudeValue = document.getElementById('amplitude-value');

  let speed = 1;
  let waveNumber = 3;
  let amplitude = 0.35;
  let isCircular = false;

  circularInput.addEventListener('change', () => {
    isCircular = circularInput.checked;
    kb.setAttribute('sweep', isCircular ? '360' : '270');
  });

  speedInput.addEventListener('input', () => {
    speed = parseFloat(speedInput.value);
    speedValue.textContent = speed.toFixed(1) + 'x';
  });

  waveNumInput.addEventListener('input', () => {
    waveNumber = parseInt(waveNumInput.value);
    waveNumValue.textContent = waveNumber;
    wave.dataset.waveNumber = waveNumber;
  });

  amplitudeInput.addEventListener('input', () => {
    amplitude = parseFloat(amplitudeInput.value);
    amplitudeValue.textContent = amplitude.toFixed(2);
    wave.dataset.waveAmplitude = amplitude;
  });

  // Animate the wave emoji across the keyboard
  let startTime = performance.now();
  let lastFootstepTime = 0;
  let footstepPitch = 0;

  function animate(now) {
    const elapsed = (now - startTime) / 1000; // seconds

    // For circular: continuous rotation; for arc: oscillate back and forth
    let pitch;
    if (isCircular) {
      pitch = (elapsed * speed * 2) % 12; // continuous loop
    } else {
      pitch = 5.5 + Math.sin(elapsed * speed) * 5.5; // oscillate 0-11
    }

    wave.dataset.pitch = pitch;

    // Step footstep through integer pitches every 500ms
    if (now - lastFootstepTime > 500) {
      footstep.dataset.pitch = footstepPitch;
      // Black keys (raised) at radius 1, white keys at radius 0
      const blackKeys = [1, 3, 6, 8, 10];
      footstep.dataset.radius = blackKeys.includes(footstepPitch) ? 1 : 0;
      footstepPitch = (footstepPitch + 1) % 12;
      lastFootstepTime = now;
    }

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
</script>

<style>
  body {
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    font-family: system-ui, -apple-system, sans-serif;
    color: #eee;
    text-align: center;
    min-height: 100vh;
  }

  h1 {
    margin: 0 0 10px;
    font-weight: 300;
    color: #fff;
  }

  p {
    margin: 0 0 30px;
    opacity: 0.6;
    font-size: 14px;
  }

  all-around-keyboard {
    width: 90%;
    max-width: 600px;
    margin: 0 auto;
    display: block;

    /* Dark theme */
    --key-lower-fill: #2a2a4a;
    --key-lower-stroke: #4a4a6a;
    --key-upper-fill: #1a1a2a;
    --key-upper-stroke: #3a3a5a;
    --key-pressed-fill: #ff6b6b;
    --key-highlight-stroke: #4ecdc4;
  }

  .zodiac {
    font-size: 24px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    transition: transform 0.1s ease-out;
    pointer-events: none;
  }

  .wave {
    font-size: 32px;
    filter: drop-shadow(0 0 10px rgba(78, 205, 196, 0.8));
    pointer-events: none;
  }

  .footstep {
    font-size: 28px;
    filter: drop-shadow(0 0 8px rgba(255, 107, 107, 0.8));
    pointer-events: none;
  }

  .controls {
    margin-top: 30px;
    display: flex;
    gap: 30px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .controls label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: #aaa;
  }

  .controls input[type="range"] {
    width: 120px;
    accent-color: #4ecdc4;
  }

  .controls span {
    min-width: 40px;
    text-align: left;
    color: #4ecdc4;
  }

  .controls .toggle {
    cursor: pointer;
  }

  .controls .toggle input {
    accent-color: #4ecdc4;
    cursor: pointer;
  }

  .controls .toggle span {
    min-width: auto;
    color: #aaa;
  }

  .controls .toggle input:checked + span {
    color: #4ecdc4;
  }
</style>
</body>
</html>
