<!DOCTYPE html>
<meta charset="utf-8">
<body>

<all-around-keyboard id="kb" synth notes-in-octave="12"
                     raised-notes="[1,3,6,8,10]"
                     sweep="90" octaves="3" transition-time="500"
                     depth="100" width="500">
</all-around-keyboard>

<p>Click keys or use Tab + Arrow keys to navigate, Enter/Space to play</p>

<script src="../lib/all-around-keyboard.js"></script>
<script>
  const kb = document.getElementById('kb');

  // Track pressed keys in a Set
  const pressed = new Set();

  // Handle user clicks - toggle pressed state
  kb.addEventListener('keyclick', (e) => {
    const { index } = e.detail;
    if (pressed.has(index)) {
      pressed.delete(index);
    } else {
      pressed.add(index);
    }
    // Update the component's state
    kb.pressedKeys = [...pressed];
  });

  // Optional: show hover feedback
  kb.addEventListener('keyhover', (e) => {
    kb.hoveredKeys = [e.detail.index];
  });

  kb.addEventListener('keyunhover', () => {
    kb.hoveredKeys = [];
  });
</script>

<style>
  body {
    margin: 0 4%;
    background: aquamarine;
    font-family: sans-serif;
    color: #4466bb;
    text-align: center;
  }

  p {
    margin-top: 20px;
    font-size: 14px;
    opacity: 0.7;
  }

  all-around-keyboard {
    width: 94%;
    max-width: 700px;
    margin: 50px auto 0;
    display: inline-block;
    border: solid #4466bb 1px;
    padding: 3%;

    /* Custom colors via CSS custom properties */
    --key-pressed-fill: coral;
    --key-highlight-stroke: #4466bb;
  }
</style>
