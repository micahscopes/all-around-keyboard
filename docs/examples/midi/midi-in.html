<title>all-around-keyboard: MIDI input</title>

<script src="../../lib/all-around-keyboard.min.js"></script>
<script src="../../lib/webmidi.min.js"></script>
<h2>MIDI in</h2>
These 16 keyboards are set to receive 16 channels of MIDI
from the first available Web MIDI input.
<script>
// midi receive example

  var keyboards = {};
  var pressedKeys = {}; // Track pressed keys per channel
  var litNotes = {};    // Track lit notes per channel
  var row, grid;

  grid = document.createElement("div");
  grid.setAttribute("id","kb-table");
  document.body.appendChild(grid);

  for(var ch=1; ch<=16; ch++){
    if(ch%4 == 1){
      row = document.createElement("div");
      grid.appendChild(row);
    }
    let kb = document.createElement("all-around-keyboard");
    kb.classList.add("col"+(ch%4))
    kb.leftmostKey = 12;
    kb.baseKey = 12;
    kb.synth = true; kb.octaves = 7;
    kb.depth = 150;
    kb.width = 800;
    kb.pie = false;
    kb.sweep = Math.PI*2;
    row.appendChild(kb);
    keyboards[ch] = kb;
    pressedKeys[ch] = new Set();
    litNotes[ch] = new Set();
  }

  WebMidi.enable(function (err) {
    if (err) { console.log("WebMidi could not be enabled.", err); }
    var midiIn = WebMidi.inputs[0];

    midiIn.addListener('noteon', 'all', function (e) {
        const ch = e.channel;
        pressedKeys[ch].add(e.note.number);
        litNotes[ch].add(e.note.number % 12);
        keyboards[ch].pressedKeys = [...pressedKeys[ch]];
        keyboards[ch].litNotes = [...litNotes[ch]];
    });

    midiIn.addListener('noteoff', 'all', function (e) {
        const ch = e.channel;
        pressedKeys[ch].delete(e.note.number);
        litNotes[ch].delete(e.note.number % 12);
        keyboards[ch].pressedKeys = [...pressedKeys[ch]];
        keyboards[ch].litNotes = [...litNotes[ch]];
    });
  });

</script>
